name: Verify BitGods

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify entry-point parity
        run: cmp START_HERE.html index.html

      - name: Run deterministic runtime gate
        run: node verify-runtime.cjs
